<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} — User Guides</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
      </svg>
      User Guides
    </a>
    <div class="navbar-actions" id="navActions"></div>
  </nav>

  <div class="guide-layout" style="max-width:1300px;">
    <aside class="guide-sidebar" id="sidebar" style="width:260px;">
      <h4>On this page</h4>
      <ul class="toc-list" id="tocList"></ul>
      <div class="page-tree" id="pageTree"></div>
    </aside>
    <main class="guide-content" id="guideContent">
      <h1>{{title}}</h1>
      {{content}}
    </main>
  </div>

  <!-- Lightbox Overlay -->
  <div class="lightbox-overlay" id="lightboxOverlay">
    <button class="lightbox-close" id="lightboxClose">&#x2715;</button>
    <img id="lightboxImg" src="">
  </div>

  <script>
    const isAdmin = {{isAdmin}};
    const slug = '{{slug}}';

    // Admin nav
    if (isAdmin) {
      document.getElementById('navActions').innerHTML = `
        <a href="/admin/guide/${slug}" class="btn btn-primary btn-sm">Edit Guide</a>
        <a href="/guide/${slug}/print" target="_blank" class="btn btn-secondary btn-sm">&#x1F5A8; Print</a>
        <a href="/" class="btn btn-secondary btn-sm">All Guides</a>
        <a href="/admin/logout" class="btn btn-secondary btn-sm">Logout</a>
      `;
    } else {
      document.getElementById('navActions').innerHTML = `
        <a href="/guide/${slug}/print" target="_blank" class="btn btn-secondary btn-sm">&#x1F5A8; Print</a>
        <a href="/" class="btn btn-secondary btn-sm">All Guides</a>
      `;
    }

    // Generate a text-based ID from heading text
    function textToAnchorId(text) {
      return text.toLowerCase().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').substring(0, 60);
    }

    // Alias map: alternative IDs → heading element (for deep-link matching)
    const anchorAliases = {};

    // Generate TOC from headings (supports h2, h3, and custom .section-heading, .sub-heading, .sub2-heading)
    function buildToc() {
      const content = document.getElementById('guideContent');
      const toc = document.getElementById('tocList');
      const headings = content.querySelectorAll('h2, h3, h4, .section-heading, .sub-heading, .sub2-heading');

      if (headings.length === 0) {
        document.getElementById('sidebar').style.display = 'none';
        return;
      }

      const usedIds = new Set();
      const seen = new Set();
      headings.forEach((heading, i) => {
        if (seen.has(heading)) return;
        seen.add(heading);

        // Preserve the original content ID if it exists
        const origId = heading.id || '';

        // Generate text-based ID from textContent (what browser sees)
        const textId = textToAnchorId(heading.textContent);

        // Also generate a "clean" ID stripping leading numbers (for search matches)
        const cleanText = heading.textContent.replace(/^\d+[\.\s]*/g, '').trim();
        const cleanId = textToAnchorId(cleanText);

        // Also simulate how stripHtml works (replaces tags with spaces)
        // This handles <span class="num">3</span>Text → "3 text" → "3-text"
        const innerHtml = heading.innerHTML;
        const stripHtmlText = innerHtml.replace(/<[^>]+>/g, ' ').replace(/&[^;]+;/g, ' ').replace(/\s+/g, ' ').trim();
        const stripHtmlId = textToAnchorId(stripHtmlText);

        // Pick the primary ID: prefer original content ID, then text-based
        let primaryId;
        if (origId && origId !== '') {
          primaryId = origId;
        } else {
          primaryId = textId || 'section-' + i;
          if (usedIds.has(primaryId)) {
            let c = 2;
            while (usedIds.has(primaryId + '-' + c)) c++;
            primaryId = primaryId + '-' + c;
          }
        }
        usedIds.add(primaryId);
        heading.id = primaryId;

        // Register all alternative IDs as aliases pointing to this heading
        [textId, cleanId, stripHtmlId, origId].forEach(aid => {
          if (aid && aid !== primaryId && aid.length > 1) {
            anchorAliases[aid] = heading;
          }
        });

        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#' + heading.id;
        a.textContent = heading.textContent.replace(/^\d+\s*/, '').substring(0, 60);

        const isSubHeading = heading.classList.contains('sub-heading') || heading.tagName === 'H3';
        const isSub2Heading = heading.classList.contains('sub2-heading') || heading.tagName === 'H4';
        if (isSub2Heading) {
          a.className = 'toc-h3';
          a.style.paddingLeft = '36px';
          a.style.fontSize = '12px';
        } else if (isSubHeading) {
          a.className = 'toc-h3';
        }

        a.addEventListener('click', (e) => {
          e.preventDefault();
          heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
          history.replaceState(null, '', '#' + heading.id);
        });
        li.appendChild(a);
        toc.appendChild(li);
      });

      // Highlight active TOC item on scroll
      const tocLinks = toc.querySelectorAll('a');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            tocLinks.forEach(l => l.classList.remove('active'));
            const active = toc.querySelector(`a[href="#${CSS.escape(entry.target.id)}"]`);
            if (active) active.classList.add('active');
          }
        });
      }, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });

      headings.forEach(h => observer.observe(h));
    }

    buildToc();

    // --- Scroll to hash section on page load (deep link from search) ---
    function scrollToHash() {
      const hash = decodeURIComponent(window.location.hash.substring(1));
      if (!hash) return;

      let target = null;

      // 1. Exact ID match
      target = document.getElementById(hash);

      // 2. Check alias map (covers text-based, clean, and stripHtml variants)
      if (!target && anchorAliases[hash]) {
        target = anchorAliases[hash];
      }

      // 3. Partial/prefix match against heading IDs and aliases
      if (!target) {
        const allHeadings = document.querySelectorAll('#guideContent h2, #guideContent h3, #guideContent h4, #guideContent .section-heading, #guideContent .sub-heading, #guideContent .sub2-heading');
        // Try: heading ID contains the hash, or hash contains heading ID
        for (const h of allHeadings) {
          if (!h.id) continue;
          if (h.id.includes(hash) || hash.includes(h.id)) {
            target = h;
            break;
          }
        }
        // Try: alias contains the hash
        if (!target) {
          for (const [aid, el] of Object.entries(anchorAliases)) {
            if (aid.includes(hash) || hash.includes(aid)) {
              target = el;
              break;
            }
          }
        }
      }

      // 4. Last resort: fuzzy match — strip numbers/dashes and compare
      if (!target) {
        const normalize = s => s.replace(/[\d-]/g, '').toLowerCase();
        const normHash = normalize(hash);
        if (normHash.length > 2) {
          const allHeadings = document.querySelectorAll('#guideContent h2, #guideContent h3, #guideContent h4, #guideContent .section-heading, #guideContent .sub-heading, #guideContent .sub2-heading');
          for (const h of allHeadings) {
            if (h.id && normalize(h.id) === normHash) {
              target = h;
              break;
            }
          }
          if (!target) {
            for (const [aid, el] of Object.entries(anchorAliases)) {
              if (normalize(aid) === normHash) {
                target = el;
                break;
              }
            }
          }
        }
      }

      if (target) {
        setTimeout(() => {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          // Highlight the section briefly
          target.style.transition = 'background 0.3s ease';
          target.style.background = '#fef08a';
          target.style.borderRadius = '4px';
          target.style.padding = '2px 8px';
          target.style.marginLeft = '-8px';
          setTimeout(() => {
            target.style.background = '';
            target.style.borderRadius = '';
            target.style.padding = '';
            target.style.marginLeft = '';
          }, 2500);
        }, 300);
      }
    }

    scrollToHash();
    window.addEventListener('hashchange', scrollToHash);

    // --- Syntax highlighting for code blocks ---
    if (typeof hljs !== 'undefined') {
      document.querySelectorAll('.code-block-wrapper pre code').forEach(block => {
        hljs.highlightElement(block);
      });
      // Also highlight plain pre>code blocks without wrapper
      document.querySelectorAll('pre code:not(.code-block-wrapper code)').forEach(block => {
        hljs.highlightElement(block);
      });
    }

    // --- Code copy buttons ---
    document.querySelectorAll('.code-block-wrapper .code-copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const wrapper = btn.closest('.code-block-wrapper');
        const code = wrapper ? wrapper.querySelector('code') : null;
        if (code) {
          navigator.clipboard.writeText(code.textContent).then(() => {
            const origText = btn.innerHTML;
            btn.textContent = 'Copied!';
            setTimeout(() => { btn.innerHTML = origText; }, 2000);
          });
        }
      });
    });

    // --- Task list checkbox toggling ---
    document.querySelectorAll('.task-list .task-item input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        const li = cb.closest('.task-item');
        if (li) li.classList.toggle('checked', cb.checked);
      });
    });

    // --- Image lightbox ---
    const lightboxOverlay = document.getElementById('lightboxOverlay');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');

    document.getElementById('guideContent').addEventListener('click', (e) => {
      if (e.target.tagName === 'IMG') {
        lightboxImg.src = e.target.src;
        lightboxOverlay.classList.add('visible');
      }
    });

    lightboxOverlay.addEventListener('click', (e) => {
      if (e.target === lightboxOverlay || e.target === lightboxClose) {
        lightboxOverlay.classList.remove('visible');
      }
    });

    lightboxClose.addEventListener('click', () => {
      lightboxOverlay.classList.remove('visible');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightboxOverlay.classList.contains('visible')) {
        lightboxOverlay.classList.remove('visible');
      }
    });

    // --- Tabbed content switching ---
    document.querySelectorAll('.tab-container').forEach(container => {
      container.querySelectorAll('.add-tab-btn').forEach(b => b.remove());
      container.querySelectorAll('.tab-header').forEach(header => {
        header.addEventListener('click', () => {
          const tabIdx = header.dataset.tab;
          container.querySelectorAll('.tab-header').forEach(h => h.classList.remove('active'));
          container.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
          header.classList.add('active');
          const panel = container.querySelector('.tab-panel[data-tab="' + tabIdx + '"]');
          if (panel) panel.classList.add('active');
        });
      });
    });

    // --- Table sorting ---
    document.querySelectorAll('#guideContent table').forEach(table => {
      const thead = table.querySelector('thead');
      if (!thead) return;
      const headers = thead.querySelectorAll('th');
      if (headers.length === 0) return;
      const tbody = table.querySelector('tbody');
      if (!tbody) return;

      headers.forEach((th, colIdx) => {
        const arrow = document.createElement('span');
        arrow.className = 'sort-arrow';
        th.appendChild(arrow);
        th.addEventListener('click', () => {
          const isAsc = arrow.classList.contains('asc');
          // Reset all arrows
          headers.forEach(h => {
            const a = h.querySelector('.sort-arrow');
            if (a) a.className = 'sort-arrow';
          });
          const dir = isAsc ? 'desc' : 'asc';
          arrow.classList.add(dir);
          const rows = [...tbody.querySelectorAll('tr')];
          rows.sort((a, b) => {
            const aText = (a.children[colIdx] || {}).textContent || '';
            const bText = (b.children[colIdx] || {}).textContent || '';
            const aNum = parseFloat(aText);
            const bNum = parseFloat(bText);
            let cmp;
            if (!isNaN(aNum) && !isNaN(bNum)) {
              cmp = aNum - bNum;
            } else {
              cmp = aText.localeCompare(bText);
            }
            return dir === 'desc' ? -cmp : cmp;
          });
          rows.forEach(r => tbody.appendChild(r));
        });
      });
    });

    // --- Comment tooltips ---
    document.querySelectorAll('.comment-highlight').forEach(span => {
      if (span.dataset.comment) {
        span.title = span.dataset.comment;
      }
    });

    // --- Page tree navigation ---
    fetch('/api/guide-tree').then(r => r.json()).then(data => {
      if (!data.guides || data.guides.length < 2) return;
      const tree = document.getElementById('pageTree');
      const current = data.guides.find(g => g.slug === slug);
      const currentParent = current ? current.parent_id : null;

      // Build a simple tree: show top-level guides and children of current's parent
      const topLevel = data.guides.filter(g => !g.parent_id);
      const children = {};
      data.guides.forEach(g => {
        if (g.parent_id) {
          if (!children[g.parent_id]) children[g.parent_id] = [];
          children[g.parent_id].push(g);
        }
      });

      let html = '<h4>All Guides</h4>';
      topLevel.forEach(g => {
        const isActive = g.slug === slug;
        html += '<a class="page-tree-item' + (isActive ? ' active' : '') + '" href="/guide/' + g.slug + '">' + g.title + '</a>';
        if (children[g.id]) {
          children[g.id].forEach(c => {
            const isChildActive = c.slug === slug;
            html += '<a class="page-tree-item child' + (isChildActive ? ' active' : '') + '" href="/guide/' + c.slug + '">' + c.title + '</a>';
          });
        }
      });
      tree.innerHTML = html;
    }).catch(() => {});
  </script>
</body>
</html>
