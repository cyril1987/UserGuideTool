<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Guides</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ===========================
       SEARCH HERO SECTION
       =========================== */
    .search-hero {
      text-align: center;
      padding: 56px 20px 32px;
      background: linear-gradient(135deg, #f0f4ff 0%, #e8eeff 50%, #f5f0ff 100%);
      border-bottom: 1px solid var(--gray-200);
    }
    .search-hero h1 {
      font-size: 32px;
      font-weight: 800;
      color: var(--gray-900);
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .search-hero p {
      color: var(--gray-500);
      font-size: 16px;
      margin-bottom: 28px;
    }

    /* ChatGPT-style search bar */
    .search-bar-wrap {
      max-width: 680px;
      margin: 0 auto;
      position: relative;
    }
    .search-bar {
      display: flex;
      align-items: center;
      background: white;
      border: 2px solid var(--gray-200);
      border-radius: 16px;
      padding: 6px 8px 6px 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
      transition: all 0.2s ease;
    }
    .search-bar:focus-within {
      border-color: var(--primary);
      box-shadow: 0 4px 24px rgba(37,99,235,0.12), 0 0 0 3px rgba(37,99,235,0.08);
    }
    .search-bar .search-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      color: var(--gray-400);
      margin-right: 12px;
    }
    .search-bar input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      color: var(--gray-800);
      background: transparent;
      padding: 10px 0;
      font-family: inherit;
    }
    .search-bar input::placeholder {
      color: var(--gray-400);
    }
    .search-bar .search-submit {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .search-bar .search-submit:hover {
      background: #1d4ed8;
    }
    .search-bar .search-submit svg {
      width: 18px;
      height: 18px;
    }
    .search-clear {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--gray-100);
      color: var(--gray-500);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      margin-right: 8px;
      font-size: 14px;
      transition: all 0.1s;
    }
    .search-clear:hover {
      background: var(--gray-200);
      color: var(--gray-700);
    }
    .search-clear.visible {
      display: flex;
    }

    /* Quick suggestions */
    .search-hints {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .search-hint {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: 20px;
      font-size: 12px;
      color: var(--gray-500);
      cursor: pointer;
      transition: all 0.15s;
    }
    .search-hint:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: #f0f4ff;
    }
    .search-hint svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* ===========================
       SEARCH RESULTS DROPDOWN
       =========================== */
    .search-results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
      z-index: 100;
      display: none;
      overflow: hidden;
      max-height: 480px;
      overflow-y: auto;
    }
    .search-results.visible {
      display: block;
    }
    .search-results-header {
      padding: 12px 20px 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gray-400);
      border-bottom: 1px solid var(--gray-100);
    }
    .search-result-item {
      display: block;
      padding: 14px 20px;
      border-bottom: 1px solid var(--gray-50);
      text-decoration: none;
      color: inherit;
      transition: background 0.1s;
    }
    .search-result-item:hover {
      background: #f8faff;
    }
    .search-result-item:last-child {
      border-bottom: none;
    }
    .sr-guide-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--gray-900);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sr-guide-title svg {
      width: 16px;
      height: 16px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }
    .sr-guide-summary {
      font-size: 13px;
      color: var(--gray-500);
      margin-top: 4px;
      line-height: 1.5;
    }
    .sr-sections {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sr-section {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 12px;
      background: var(--gray-50);
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      transition: background 0.1s;
      border: 1px solid transparent;
    }
    .sr-section:hover {
      background: #eef2ff;
      border-color: #c7d2fe;
    }
    .sr-section-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      color: var(--primary);
      margin-top: 1px;
    }
    .sr-section-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }
    .sr-section-heading {
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-800);
    }
    .sr-section-snippet {
      font-size: 12px;
      color: var(--gray-500);
      line-height: 1.4;
      margin-top: 2px;
    }
    .sr-section-snippet mark {
      background: #fef08a;
      color: var(--gray-900);
      padding: 0 2px;
      border-radius: 2px;
    }
    /* Match type labels */
    .sr-match-label {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: auto;
      flex-shrink: 0;
    }
    .sr-match-label.exact { background: #dcfce7; color: #15803d; }
    .sr-match-label.similar { background: #dbeafe; color: #1d4ed8; }
    .sr-match-label.related { background: #fef3c7; color: #b45309; }
    .sr-match-label.fuzzy { background: #f3e8ff; color: #7c3aed; }
    .sr-matched-terms {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .sr-matched-term {
      font-size: 10px;
      padding: 1px 6px;
      background: var(--gray-100);
      color: var(--gray-500);
      border-radius: 4px;
    }
    .sr-score {
      font-size: 10px;
      color: var(--gray-400);
      margin-left: 8px;
    }

    .sr-no-results {
      padding: 32px 20px;
      text-align: center;
      color: var(--gray-400);
    }
    .sr-no-results svg {
      width: 40px;
      height: 40px;
      stroke: var(--gray-300);
      fill: none;
      stroke-width: 1.5;
      margin-bottom: 8px;
    }
    .sr-no-results p {
      font-size: 14px;
      margin: 4px 0;
    }

    /* Searching state */
    .search-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid var(--gray-200);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 10px;
    }
    .search-spinner.visible { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===========================
       GUIDES SECTION BELOW SEARCH
       =========================== */
    .home-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gray-400);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gray-200);
    }

    /* Guide cards (enhanced) */
    .guide-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .guide-card-v2 {
      display: flex;
      flex-direction: column;
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      padding: 20px 24px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
      position: relative;
    }
    .guide-card-v2:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 16px rgba(37,99,235,0.1);
      transform: translateY(-2px);
    }
    .guide-card-v2 .gc-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #eff3ff, #dbeafe);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .guide-card-v2 .gc-icon svg {
      width: 18px;
      height: 18px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 2;
    }
    .guide-card-v2 h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 6px;
    }
    .guide-card-v2 .gc-meta {
      font-size: 12px;
      color: var(--gray-400);
      margin-top: auto;
      padding-top: 8px;
    }
    .guide-card-v2 .gc-arrow {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 20px;
      height: 20px;
      color: var(--gray-300);
      transition: all 0.2s;
    }
    .guide-card-v2:hover .gc-arrow {
      color: var(--primary);
      transform: translateX(3px);
    }
    .guide-card-v2 .gc-arrow svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .empty-state-v2 {
      text-align: center;
      padding: 48px 20px;
      color: var(--gray-400);
    }
    .empty-state-v2 svg {
      width: 48px;
      height: 48px;
      stroke: var(--gray-300);
      fill: none;
      stroke-width: 1.5;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
      </svg>
      User Guides
    </a>
    <div class="navbar-actions" id="navActions"></div>
  </nav>

  <!-- Search Hero -->
  <div class="search-hero">
    <h1>How can we help you?</h1>
    <p>Search guides, topics, and step-by-step instructions</p>

    <div class="search-bar-wrap">
      <div class="search-bar" id="searchBar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Ask anything... e.g. &quot;How do I process an invoice?&quot;" autocomplete="off" spellcheck="false">
        <div class="search-spinner" id="searchSpinner"></div>
        <button class="search-clear" id="searchClear" title="Clear">&times;</button>
        <button class="search-submit" id="searchSubmit" title="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>

      <!-- Instant search results -->
      <div class="search-results" id="searchResults"></div>
    </div>

    <!-- Quick suggestion chips -->
    <div class="search-hints" id="searchHints"></div>
  </div>

  <!-- Guide listing -->
  <div class="home-content">
    <div class="section-title">All Guides</div>
    <div class="guide-list" id="guideList">
      {{guideList}}
    </div>
  </div>

  <script>
    const isAdmin = {{isAdmin}};

    // Admin nav
    if (isAdmin) {
      document.getElementById('navActions').innerHTML = `
        <a href="/admin/guide/new" class="btn btn-primary btn-sm">+ New Guide</a>
        <a href="/admin/logout" class="btn btn-secondary btn-sm">Logout</a>
      `;
    } else {
      document.getElementById('navActions').innerHTML = `
        <a href="/admin/login" class="btn btn-secondary btn-sm">Admin Login</a>
      `;
    }

    // ===========================
    //  SEARCH
    // ===========================
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const searchClear = document.getElementById('searchClear');
    const searchSpinner = document.getElementById('searchSpinner');
    let searchTimer = null;

    // Instant search on typing
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim();
      searchClear.classList.toggle('visible', q.length > 0);

      clearTimeout(searchTimer);
      if (q.length < 2) {
        searchResults.classList.remove('visible');
        return;
      }

      searchSpinner.classList.add('visible');
      searchTimer = setTimeout(() => doSearch(q), 250);
    });

    // Submit button / Enter key
    document.getElementById('searchSubmit').addEventListener('click', () => {
      const q = searchInput.value.trim();
      if (q.length >= 2) doSearch(q);
    });
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const q = searchInput.value.trim();
        if (q.length >= 2) doSearch(q);
      }
      if (e.key === 'Escape') {
        searchResults.classList.remove('visible');
        searchInput.blur();
      }
    });

    // Clear button
    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchClear.classList.remove('visible');
      searchResults.classList.remove('visible');
      searchInput.focus();
    });

    // Close results on outside click
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-bar-wrap')) {
        searchResults.classList.remove('visible');
      }
    });

    // Re-show results on focus if has content
    searchInput.addEventListener('focus', () => {
      if (searchResults.innerHTML && searchInput.value.trim().length >= 2) {
        searchResults.classList.add('visible');
      }
    });

    // Highlight matching text — highlights the query AND any matched terms
    function highlightText(text, query, matchedTerms) {
      if (!query && (!matchedTerms || matchedTerms.length === 0)) return escapeHtml(text);
      const escaped = escapeHtml(text);

      // Collect all terms to highlight (query + matched terms)
      const terms = new Set();
      if (query) {
        // Split query into words for individual highlighting
        query.split(/\s+/).forEach(w => { if (w.length >= 2) terms.add(w); });
        // Also add full query for exact phrase highlighting
        if (query.includes(' ')) terms.add(query);
      }
      if (matchedTerms) matchedTerms.forEach(t => { if (t.length >= 2) terms.add(t); });

      // Sort by length descending so longer matches take priority
      const sorted = [...terms].sort((a, b) => b.length - a.length);
      const pattern = sorted.map(t => escapeRegex(t)).join('|');
      if (!pattern) return escaped;

      const re = new RegExp('(' + pattern + ')', 'gi');
      return escaped.replace(re, '<mark>$1</mark>');
    }
    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    async function doSearch(query) {
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        searchSpinner.classList.remove('visible');
        renderResults(data.results, query);
      } catch (err) {
        searchSpinner.classList.remove('visible');
        searchResults.innerHTML = '<div class="sr-no-results"><p>Search failed. Please try again.</p></div>';
        searchResults.classList.add('visible');
      }
    }

    function renderResults(results, query) {
      if (results.length === 0) {
        searchResults.innerHTML = `
          <div class="sr-no-results">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="8" x2="14" y2="14"/><line x1="14" y1="8" x2="8" y2="14"/></svg>
            <p><strong>No results found</strong></p>
            <p style="font-size:12px;color:var(--gray-400);">Try different keywords, synonyms, or check spelling</p>
          </div>
        `;
        searchResults.classList.add('visible');
        return;
      }

      let html = '<div class="search-results-header">Results</div>';

      for (const r of results) {
        const mt = r.matchedTerms || [];

        // Match label class
        let labelClass = 'exact';
        if (r.matchLabel === 'fuzzy match') labelClass = 'fuzzy';
        else if (r.matchLabel === 'related match') labelClass = 'related';
        else if (r.matchLabel === 'similar match') labelClass = 'similar';

        // Guide-level result
        html += `<div class="search-result-item" style="cursor:default;">`;
        html += `<div class="sr-guide-title">
          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
          <a href="/guide/${r.slug}" style="color:inherit;text-decoration:none;">${highlightText(r.title, query, mt)}</a>
          <span class="sr-match-label ${labelClass}">${escapeHtml(r.matchLabel || 'match')}</span>
        </div>`;

        // Show matched terms if they differ from the raw query
        if (mt.length > 0) {
          const queryWords = query.toLowerCase().split(/\s+/);
          const extraTerms = mt.filter(t => !queryWords.includes(t));
          if (extraTerms.length > 0) {
            html += '<div class="sr-matched-terms">';
            html += extraTerms.slice(0, 4).map(t => `<span class="sr-matched-term">matched: ${escapeHtml(t)}</span>`).join('');
            html += '</div>';
          }
        }

        if (r.sections.length === 0 && r.summary) {
          html += `<div class="sr-guide-summary">${highlightText(r.summary, query, mt)}</div>`;
        }

        // Section-level results
        if (r.sections.length > 0) {
          html += '<div class="sr-sections">';
          for (const s of r.sections) {
            const sectionUrl = `/guide/${r.slug}#${encodeURIComponent(s.anchorId)}`;
            html += `<a href="${sectionUrl}" class="sr-section">
              <span class="sr-section-icon"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>
              <div>
                <div class="sr-section-heading">${highlightText(s.heading, query, mt)}</div>
                <div class="sr-section-snippet">${highlightText(s.snippet, query, mt)}</div>
              </div>
            </a>`;
          }
          html += '</div>';
        }
        html += '</div>';
      }

      searchResults.innerHTML = html;
      searchResults.classList.add('visible');
    }

    // ===========================
    //  SEARCH HINTS (auto-generated from guide titles)
    // ===========================
    function buildHints() {
      const cards = document.querySelectorAll('.guide-card-v2 h3');
      const hints = document.getElementById('searchHints');
      const hintTerms = [];

      cards.forEach(card => {
        // Extract meaningful words from guide titles
        const title = card.textContent.trim();
        hintTerms.push(title);
      });

      // Show first 4 guides as hint chips
      hints.innerHTML = hintTerms.slice(0, 4).map(term =>
        `<button class="search-hint" data-query="${escapeHtml(term)}">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          ${escapeHtml(term.length > 30 ? term.substring(0, 30) + '...' : term)}
        </button>`
      ).join('');

      hints.querySelectorAll('.search-hint').forEach(btn => {
        btn.addEventListener('click', () => {
          searchInput.value = btn.dataset.query;
          searchInput.focus();
          searchClear.classList.add('visible');
          doSearch(btn.dataset.query);
        });
      });
    }

    buildHints();
  </script>
</body>
</html>
