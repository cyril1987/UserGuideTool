<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{pageTitle}} — User Guides</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ===========================
       EDITOR LAYOUT
       =========================== */

    /* Modal styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.visible {
      display: flex;
    }
    .modal {
      background: white;
      border-radius: var(--radius);
      padding: 24px;
      width: 400px;
      max-width: 90vw;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal h3 {
      font-size: 18px;
      margin-bottom: 16px;
      color: var(--gray-900);
    }
    .modal .form-group {
      margin-bottom: 12px;
    }
    .modal .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    /* ===========================
       FORMAT TOOLBAR
       =========================== */
    .format-toolbar {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 6px 12px;
      background: white;
      border-bottom: 1px solid var(--gray-200);
      flex-wrap: wrap;
    }
    .fmt-group {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 4px;
    }
    .fmt-group + .fmt-group {
      border-left: 1px solid var(--gray-200);
      margin-left: 4px;
      padding-left: 8px;
    }
    .fmt-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 30px;
      border: none;
      background: none;
      border-radius: 4px;
      cursor: pointer;
      color: var(--gray-600);
      font-size: 14px;
      font-weight: 600;
      transition: all 0.1s;
    }
    .fmt-btn:hover {
      background: var(--gray-100);
      color: var(--gray-900);
    }
    .fmt-btn.active {
      background: var(--primary-light);
      color: var(--primary);
    }
    .fmt-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }
    .fmt-select {
      height: 30px;
      border: 1px solid var(--gray-200);
      border-radius: 4px;
      padding: 0 8px;
      font-size: 12px;
      color: var(--gray-700);
      background: white;
      cursor: pointer;
    }

    /* Insert toolbar */
    .insert-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-200);
      flex-wrap: wrap;
    }
    .insert-toolbar-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gray-400);
      font-weight: 600;
      margin-right: 4px;
    }
    .insert-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: 1px solid var(--gray-300);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      color: var(--gray-600);
      white-space: nowrap;
      height: 28px;
    }
    .insert-btn:hover {
      background: var(--gray-100);
      color: var(--gray-800);
    }

    /* Mode toggle tabs */
    .editor-mode-tabs {
      display: flex;
      background: var(--gray-100);
      border-bottom: 1px solid var(--gray-200);
      padding: 0 16px;
    }
    .editor-mode-tab {
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--gray-500);
      border-bottom: 2px solid transparent;
      transition: all 0.15s ease;
    }
    .editor-mode-tab:hover {
      color: var(--gray-700);
    }
    .editor-mode-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: white;
    }

    /* ===========================
       VISUAL EDITOR (contenteditable)
       =========================== */
    #visual-editor {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
      background: white;
      outline: none;
      min-height: 400px;
      line-height: 1.7;
      font-size: 15px;
      color: var(--gray-800);
    }
    #visual-editor:empty::before {
      content: 'Start writing your guide...';
      color: var(--gray-400);
      pointer-events: none;
    }
    /* Apply the same rich content styles as guide-content */
    #visual-editor .card {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: 14px;
      padding: 28px 32px;
      margin: 20px 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    #visual-editor .card p { margin: 10px 0; }

    #visual-editor img {
      max-width: 100%;
      border-radius: 8px;
      margin: 8px 0;
    }

    /* HTML Source editor */
    #source-editor {
      display: none;
      width: 100%;
      flex: 1;
      padding: 16px 20px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.6;
      border: none;
      outline: none;
      resize: none;
      background: #1e1e2e;
      color: #cdd6f4;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
      </svg>
      User Guides
    </a>
    <div class="navbar-actions">
      <a href="/" class="btn btn-secondary btn-sm">All Guides</a>
      <a href="/admin/logout" class="btn btn-secondary btn-sm">Logout</a>
    </div>
  </nav>

  <div class="editor-layout">
    <!-- Top bar with title and save -->
    <div class="editor-toolbar-top">
      <input type="text" class="editor-title-input" id="guideTitle" placeholder="Guide title..." value="{{title}}">
      <div class="editor-actions">
        <span class="save-status" id="saveStatus"></span>
        <button class="btn btn-danger btn-sm" id="deleteBtn" style="display:none;">Delete</button>
        <button class="btn btn-secondary btn-sm" id="previewBtn">Preview</button>
        <button class="btn btn-primary btn-sm" id="saveBtn">Save</button>
      </div>
    </div>

    <!-- Format toolbar -->
    <div class="format-toolbar" id="formatToolbar">
      <div class="fmt-group">
        <select class="fmt-select" id="blockType" title="Block type">
          <option value="p">Paragraph</option>
          <option value="h1">Heading 1</option>
          <option value="h2">Heading 2</option>
          <option value="h3">Heading 3</option>
          <option value="h4">Heading 4</option>
          <option value="blockquote">Quote</option>
          <option value="pre">Code Block</option>
        </select>
      </div>
      <div class="fmt-group">
        <button class="fmt-btn" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
        <button class="fmt-btn" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
        <button class="fmt-btn" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
        <button class="fmt-btn" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
      </div>
      <div class="fmt-group">
        <button class="fmt-btn" data-cmd="insertOrderedList" title="Numbered list">
          <svg viewBox="0 0 24 24"><path d="M10 6h11M10 12h11M10 18h11M4 6h1v4M4 10h2M4 14.5a1.5 1.5 0 011.5-1.5h.5l-2 3h2"/></svg>
        </button>
        <button class="fmt-btn" data-cmd="insertUnorderedList" title="Bullet list">
          <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.5" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
      <div class="fmt-group">
        <button class="fmt-btn" data-cmd="createLink" title="Insert link">
          <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
        </button>
        <button class="fmt-btn" id="btnUnlink" title="Remove link">
          <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/><line x1="4" y1="4" x2="20" y2="20" stroke-width="2"/></svg>
        </button>
      </div>
      <div class="fmt-group">
        <button class="fmt-btn" data-cmd="undo" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 24 24"><path d="M3 10h10a5 5 0 015 5v2M3 10l5-5M3 10l5 5"/></svg>
        </button>
        <button class="fmt-btn" data-cmd="redo" title="Redo (Ctrl+Y)">
          <svg viewBox="0 0 24 24"><path d="M21 10H11a5 5 0 00-5 5v2M21 10l-5-5M21 10l-5 5"/></svg>
        </button>
      </div>
    </div>

    <!-- Insert block toolbar -->
    <div class="insert-toolbar" id="insertToolbar">
      <span class="insert-toolbar-label">Insert:</span>
      <button class="insert-btn" id="insertTip" title="Insert a Tip callout">&#x2705; Tip</button>
      <button class="insert-btn" id="insertBulb" title="Insert a Did You Know callout">&#x1F4A1; Did You Know</button>
      <button class="insert-btn" id="insertWarn" title="Insert a Warning callout">&#x26A0;&#xFE0F; Warning</button>
      <button class="insert-btn" id="insertInfo" title="Insert an Info callout">&#x2139;&#xFE0F; Info</button>
      <button class="insert-btn" id="insertCard" title="Insert a content card">&#x1F4C4; Card</button>
      <button class="insert-btn" id="insertTable" title="Insert a table">&#x1F4CB; Table</button>
      <button class="insert-btn" id="insertImage" title="Upload an image">&#x1F4F7; Image</button>
      <button class="insert-btn" id="insertHR" title="Insert horizontal rule">&#x2015; Divider</button>
    </div>

    <!-- Editor mode tabs -->
    <div class="editor-mode-tabs">
      <button class="editor-mode-tab active" id="tabVisual">Visual</button>
      <button class="editor-mode-tab" id="tabSource">HTML Source</button>
    </div>

    <!-- Visual Editor (contenteditable) -->
    <div id="visual-editor" class="guide-content" contenteditable="true"></div>

    <!-- HTML Source Editor -->
    <textarea id="source-editor" spellcheck="false"></textarea>
  </div>

  <!-- Table insert modal -->
  <div class="modal-overlay" id="tableModal">
    <div class="modal">
      <h3>Insert Table</h3>
      <div class="form-group">
        <label for="tableRows">Rows</label>
        <input type="number" id="tableRows" value="3" min="1" max="20">
      </div>
      <div class="form-group">
        <label for="tableCols">Columns</label>
        <input type="number" id="tableCols" value="3" min="1" max="10">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary btn-sm" id="tableCancel">Cancel</button>
        <button class="btn btn-primary btn-sm" id="tableInsert">Insert</button>
      </div>
    </div>
  </div>

  <!-- Hidden file input for image upload -->
  <input type="file" id="imageInput" accept="image/*" style="display:none;">

  <!-- Delete confirmation modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3>Delete Guide</h3>
      <p style="color:var(--gray-600);margin-bottom:16px;">Are you sure you want to permanently delete this guide? This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-secondary btn-sm" id="deleteCancel">Cancel</button>
        <button class="btn btn-danger btn-sm" id="deleteConfirm">Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // --- Config ---
    const isNew = {{isNew}};
    const currentSlug = '{{slug}}';
    const existingContent = isNew ? '' : `{{content}}`;

    // --- Elements ---
    const visualEditor = document.getElementById('visual-editor');
    const sourceEditor = document.getElementById('source-editor');
    const formatToolbar = document.getElementById('formatToolbar');
    const insertToolbar = document.getElementById('insertToolbar');
    const tabVisual = document.getElementById('tabVisual');
    const tabSource = document.getElementById('tabSource');

    // --- Editor mode state ---
    let currentMode = 'visual';

    // --- Load existing content ---
    if (!isNew && existingContent) {
      visualEditor.innerHTML = existingContent;
    }

    // ===========================
    //  FORMAT TOOLBAR
    // ===========================
    // Simple commands (bold, italic, etc.)
    document.querySelectorAll('.fmt-btn[data-cmd]').forEach(btn => {
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault(); // keep focus in editor
        const cmd = btn.dataset.cmd;
        if (cmd === 'createLink') {
          const url = prompt('Enter URL:');
          if (url) document.execCommand('createLink', false, url);
        } else {
          document.execCommand(cmd, false, null);
        }
        updateToolbarState();
      });
    });

    // Unlink button
    document.getElementById('btnUnlink').addEventListener('mousedown', (e) => {
      e.preventDefault();
      document.execCommand('unlink', false, null);
    });

    // Block type selector
    document.getElementById('blockType').addEventListener('change', (e) => {
      const tag = e.target.value;
      document.execCommand('formatBlock', false, '<' + tag + '>');
      visualEditor.focus();
    });

    // Update active state of toolbar buttons
    function updateToolbarState() {
      document.querySelectorAll('.fmt-btn[data-cmd]').forEach(btn => {
        const cmd = btn.dataset.cmd;
        if (['bold', 'italic', 'underline', 'strikeThrough'].includes(cmd)) {
          btn.classList.toggle('active', document.queryCommandState(cmd));
        }
      });
      // Update block type selector
      const block = document.queryCommandValue('formatBlock');
      const sel = document.getElementById('blockType');
      const tag = block.replace(/[<>]/g, '').toLowerCase();
      if (sel.querySelector(`option[value="${tag}"]`)) {
        sel.value = tag;
      } else {
        sel.value = 'p';
      }
    }

    visualEditor.addEventListener('keyup', updateToolbarState);
    visualEditor.addEventListener('mouseup', updateToolbarState);

    // ===========================
    //  INSERT BLOCKS
    // ===========================
    function insertAtCursor(html) {
      visualEditor.focus();
      const sel = window.getSelection();
      if (sel.rangeCount) {
        const range = sel.getRangeAt(0);
        range.deleteContents();
        const frag = range.createContextualFragment(html);
        range.insertNode(frag);
        // Move cursor after the inserted content
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }

    // Callout insertion
    function insertCallout(type, icon, label) {
      insertAtCursor(`
        <div class="callout ${type}">
          <span class="callout-icon">${icon}</span>
          <div><strong>${label}:</strong> Type your content here...</div>
        </div><p><br></p>
      `);
      showToast(`${label} callout inserted`);
    }

    document.getElementById('insertTip').addEventListener('click', () => {
      insertCallout('tip', '&#x2705;', 'Tip');
    });
    document.getElementById('insertBulb').addEventListener('click', () => {
      insertCallout('tip', '&#x1F4A1;', 'Did You Know');
    });
    document.getElementById('insertWarn').addEventListener('click', () => {
      insertCallout('warn', '&#x26A0;&#xFE0F;', 'Warning');
    });
    document.getElementById('insertInfo').addEventListener('click', () => {
      insertCallout('info', '&#x2139;&#xFE0F;', 'Info');
    });

    // Card insertion
    document.getElementById('insertCard').addEventListener('click', () => {
      insertAtCursor(`
        <div class="card">
          <p>Type your card content here...</p>
        </div><p><br></p>
      `);
      showToast('Card inserted');
    });

    // Table insertion
    document.getElementById('insertTable').addEventListener('click', () => {
      document.getElementById('tableModal').classList.add('visible');
    });
    document.getElementById('tableCancel').addEventListener('click', () => {
      document.getElementById('tableModal').classList.remove('visible');
    });
    document.getElementById('tableInsert').addEventListener('click', () => {
      const rows = parseInt(document.getElementById('tableRows').value) || 3;
      const cols = parseInt(document.getElementById('tableCols').value) || 3;
      let html = '<table class="compare-table"><thead><tr>';
      for (let c = 0; c < cols; c++) html += `<th>Header ${c + 1}</th>`;
      html += '</tr></thead><tbody>';
      for (let r = 0; r < rows - 1; r++) {
        html += '<tr>';
        for (let c = 0; c < cols; c++) html += '<td>&nbsp;</td>';
        html += '</tr>';
      }
      html += '</tbody></table><p><br></p>';
      insertAtCursor(html);
      document.getElementById('tableModal').classList.remove('visible');
      showToast('Table inserted');
    });

    // HR / divider
    document.getElementById('insertHR').addEventListener('click', () => {
      insertAtCursor('<hr><p><br></p>');
    });

    // Image upload
    document.getElementById('insertImage').addEventListener('click', () => {
      document.getElementById('imageInput').click();
    });

    document.getElementById('imageInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await uploadAndInsertImage(file);
      e.target.value = '';
    });

    async function uploadAndInsertImage(file) {
      const formData = new FormData();
      formData.append('image', file);
      try {
        const res = await fetch('/admin/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.url) {
          insertAtCursor(`<img src="${data.url}" alt="Uploaded image" style="max-width:100%; border-radius:8px;" loading="lazy"><p><br></p>`);
          showToast('Image uploaded');
        } else {
          showToast('Upload failed: ' + (data.error || 'Unknown error'));
        }
      } catch (err) {
        showToast('Upload failed: ' + err.message);
      }
    }

    // Drag and drop images
    visualEditor.addEventListener('drop', async (e) => {
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        e.preventDefault();
        await uploadAndInsertImage(file);
      }
    });
    visualEditor.addEventListener('dragover', (e) => {
      e.preventDefault();
    });

    // ===========================
    //  MODE SWITCHING
    // ===========================
    function getContent() {
      return currentMode === 'source' ? sourceEditor.value : visualEditor.innerHTML;
    }

    function formatHtml(html) {
      return html
        .replace(/>\s*</g, '>\n<')
        .replace(/\n{3,}/g, '\n\n');
    }

    function switchToVisual() {
      if (currentMode === 'visual') return;
      currentMode = 'visual';
      visualEditor.innerHTML = sourceEditor.value;
      visualEditor.style.display = '';
      sourceEditor.style.display = 'none';
      formatToolbar.style.display = '';
      insertToolbar.style.display = '';
      tabVisual.classList.add('active');
      tabSource.classList.remove('active');
      visualEditor.focus();
    }

    function switchToSource() {
      if (currentMode === 'source') return;
      currentMode = 'source';
      sourceEditor.value = formatHtml(visualEditor.innerHTML);
      visualEditor.style.display = 'none';
      sourceEditor.style.display = 'block';
      formatToolbar.style.display = 'none';
      insertToolbar.style.display = 'none';
      tabSource.classList.add('active');
      tabVisual.classList.remove('active');
      sourceEditor.focus();
    }

    tabVisual.addEventListener('click', switchToVisual);
    tabSource.addEventListener('click', switchToSource);

    // Source editor: Tab key for indentation
    sourceEditor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = sourceEditor.selectionStart;
        const end = sourceEditor.selectionEnd;
        sourceEditor.value = sourceEditor.value.substring(0, start) + '  ' + sourceEditor.value.substring(end);
        sourceEditor.selectionStart = sourceEditor.selectionEnd = start + 2;
      }
    });

    // ===========================
    //  SAVE
    // ===========================
    const saveBtn = document.getElementById('saveBtn');
    const saveStatus = document.getElementById('saveStatus');

    saveBtn.addEventListener('click', save);

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        save();
      }
    });

    async function save() {
      const title = document.getElementById('guideTitle').value.trim();
      if (!title) {
        showToast('Please enter a guide title');
        return;
      }

      saveStatus.textContent = 'Saving...';
      saveStatus.className = 'save-status saving';

      try {
        if (isNew && !currentSlug) {
          const res = await fetch('/admin/guide/new', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title })
          });
          const data = await res.json();
          if (data.error) {
            showToast(data.error);
            saveStatus.textContent = '';
            return;
          }
          const content = getContent();
          await fetch(`/admin/guide/${data.slug}/save`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, content })
          });
          saveStatus.textContent = 'Saved!';
          saveStatus.className = 'save-status saved';
          showToast('Guide created');
          window.location.href = `/admin/guide/${data.slug}`;
        } else {
          const content = getContent();
          const res = await fetch(`/admin/guide/${currentSlug}/save`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, content })
          });
          const data = await res.json();
          if (data.error) {
            showToast(data.error);
            saveStatus.textContent = '';
            return;
          }
          saveStatus.textContent = 'Saved!';
          saveStatus.className = 'save-status saved';
          showToast('Guide saved');
        }
      } catch (err) {
        saveStatus.textContent = 'Error saving';
        saveStatus.className = 'save-status';
        showToast('Error: ' + err.message);
      }

      setTimeout(() => {
        saveStatus.textContent = '';
        saveStatus.className = 'save-status';
      }, 3000);
    }

    // ===========================
    //  PREVIEW
    // ===========================
    document.getElementById('previewBtn').addEventListener('click', () => {
      if (currentSlug) {
        window.open(`/guide/${currentSlug}`, '_blank');
      } else {
        showToast('Save the guide first to preview it');
      }
    });

    // ===========================
    //  DELETE
    // ===========================
    const deleteBtn = document.getElementById('deleteBtn');
    if (!isNew) {
      deleteBtn.style.display = 'inline-flex';
    }

    deleteBtn.addEventListener('click', () => {
      document.getElementById('deleteModal').classList.add('visible');
    });
    document.getElementById('deleteCancel').addEventListener('click', () => {
      document.getElementById('deleteModal').classList.remove('visible');
    });
    document.getElementById('deleteConfirm').addEventListener('click', async () => {
      try {
        await fetch(`/admin/guide/${currentSlug}/delete`, { method: 'POST' });
        window.location.href = '/';
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    });

    // ===========================
    //  TOAST
    // ===========================
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 3000);
    }
  </script>
</body>
</html>
